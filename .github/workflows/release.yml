name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux-x86_64
          - os: windows-latest
            suffix: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install SDL2
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          name=reaper-pad-${GITHUB_REF_NAME}-${{ matrix.suffix }}
          mkdir -p dist/$name
          cp target/release/libreaper_pad.so dist/$name/reaper_pad.so
          cp config.toml README.md LICENSE dist/$name/
          tar -C dist -czf dist/$name.tar.gz $name
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "reaper-pad-$env:GITHUB_REF_NAME-${{ matrix.suffix }}"
          New-Item -ItemType Directory -Force -Path "dist\$name" | Out-Null
          Copy-Item target\release\reaper_pad.dll, config.toml, README.md, LICENSE "dist\$name\"
          Compress-Archive -Path "dist\$name" -DestinationPath "dist\$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.suffix }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
